<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <script src="./src/script.js" defer></script>

    <title>Document</title>
</head>
<body>
    <p style="font-size: 50px;">Weather Widget</p>

    <main class="grid" style="width:500px; height: 200px;">
        <div class="degree" style="justify-content: space-between; margin-inline:25px; font-size: 65px;">
            <p id="degree"></p>
        
            <p id="icon">Icon</p>
        </div>
        
        <div class="location" style="justify-content: space-evenly;">
            <input id="input" type="text" placeholder="Location" style="padding-inline: auto; justify-content: center; align-items: center; display: flex;"/>

            <button id="submit">Submit</button>
        </div>
    </main>
</body>
</html>
